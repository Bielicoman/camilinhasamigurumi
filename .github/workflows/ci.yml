name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Testes da API e das regras de preço
        run: npm test
      - name: Verificação estática do site (links, CSP, alt, segredos)
        run: node scripts/verificar-site.mjs
